<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Integrated campus services in one place.">
  <meta name="theme-color" content="#5700FF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SuperCampus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SuperCampus</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
</head>
<body>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="razorpay_checkout.js"></script>
  <script>
    // Dokploy serves immutable Flutter releases, so an older Flutter service
    // worker must never keep a student or staff member on a superseded UI.
    // Retire legacy registrations/caches before loading the current bootstrap.
    (async () => {
      const controlledByOldWorker = Boolean(navigator.serviceWorker?.controller);
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map((registration) => registration.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map((key) => caches.delete(key)));
      }

      // Safari can keep serving the current document through the worker that
      // was already controlling it. Reload once after retiring that worker;
      // sessionStorage prevents a loop and naturally resets in a new session.
      if (controlledByOldWorker && !sessionStorage.getItem('sc-clean-v18')) {
        sessionStorage.setItem('sc-clean-v18', '1');
        location.reload();
        return;
      }

      const bootstrap = document.createElement('script');
      bootstrap.src = `flutter_bootstrap.js?v=20260904-19-${Date.now()}`;
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    })();
  </script>
</body>
</html>
